name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    outputs:
      Version: ${{ steps.gitversion.outputs.SemVer }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 #fetch-depth is needed for GitVersion
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal
      - name: Start local TRON node
        run: ./tests/local-node/start.sh
      - name: Test against local TRON node
        env:
          NEXUTRON_LOCAL_NODE: localhost
        run: dotnet test tests/Nexutron.LocalNode.Tests --no-build --verbosity normal
      - name: Local TRON node logs
        if: failure()
        run: docker logs --tail 200 nexutron-tron-node || true

      #Install and calculate the new version with GitVersion
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.10.2
        with:
          versionSpec: 5.x
      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v0.10.2
        id: gitversion # step id used as reference for output values
      - name: Display GitVersion outputs
        run: |
          echo "Version: ${{ steps.gitversion.outputs.SemVer }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}"

      - name: Build and Pack NuGet package
        run: |
           dotnet build src/Nexutron/Nexutron.csproj -c Release
           dotnet pack src/Nexutron/Nexutron.csproj -p:Version='${{ steps.gitversion.outputs.SemVer }}' -c Release -o nupkgs
           dotnet build src/Nexutron.Protocol/Nexutron.Protocol.csproj -c Release
           dotnet pack src/Nexutron.Protocol/Nexutron.Protocol.csproj -p:Version='${{ steps.gitversion.outputs.SemVer }}' -c Release -o nupkgs
      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nugetPackage
          path: nupkgs/*.nupkg

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' # only run job if on the main branch
    permissions:
      contents: write # create tags and releases
      packages: write # push to GitHub Packages

    steps:
      #Push NuGet package to GitHub packages
      - name: Download nuget package artifact
        uses: actions/download-artifact@v4
        with:
          name: nugetPackage
          path: nugetPackage
      - name: Push package to GitHub packages
        if: needs.build.outputs.CommitsSinceVersionSource > 0 #Only release if there has been a commit/version change
        run: dotnet nuget push "nugetPackage/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/QuantozTechnology/index.json" --skip-duplicate

      #Create release
      - name: Create Release
        if: needs.build.outputs.CommitsSinceVersionSource > 0 #Only release if there has been a commit/version change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.Version }}
        run: |
          gh release create "$VERSION" nugetPackage/*.nupkg \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Release $VERSION" \
            --generate-notes
